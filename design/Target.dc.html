<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>نافذة اختيار الهدف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 844px; height: 390px; box-sizing: border-box; padding: 24px; background: #071A1D; color: #F3EFE4; font-family: Tajawal, sans-serif; display: flex; align-items: center; justify-content: center">

<div style="width: 640px; box-sizing: border-box; background: #0F2E33; border: 2px solid #2A5F62; border-radius: 16px; padding: 20px 24px; display: flex; gap: 22px">

<div style="width: 112px; height: 160px; flex: none; border-radius: 10px; background: #F7F4EC; color: #1B1B1B; overflow: hidden; display: flex; flex-direction: column; text-align: center">
<span style="height: 24px; flex: none; background: #F2C14E"></span>
<span style="font-size: 12px; color: #5A5A5A; margin-top: 6px">أكشن</span>
<span style="font-family: Lalezar, sans-serif; font-size: 28px; flex: 1; display: flex; align-items: center; justify-content: center">قرقش</span>
<span style="font-size: 12px; padding: 0 8px 10px; color: #3A3A3A">لاعب تختاره يدفع لك 5 دنانير</span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: Lalezar, sans-serif; font-size: 26px; line-height: 1.1">اختر لاعب يدفع لك 5 دنانير</span>
<div style="display: flex; gap: 10px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="3">
<button style="flex: 1; min-height: 84px; border-radius: 12px; color: #F3EFE4; font-family: inherit; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; {{p.box}}">
<span style="font-size: 17px; font-weight: 800">{{p.name}}</span>
<span style="font-size: 13px; color: #C9DAD8">البنك {{p.bank}}</span>
<span style="font-size: 13px; color: #C9DAD8">العقارات {{p.props}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 10px; margin-top: auto">
<button style="flex: 2; height: 48px; border: 0; border-radius: 10px; background: #F2C14E; color: #1B1B1B; font-family: Lalezar, sans-serif; font-size: 20px">تأكيد</button>
<button style="flex: 1; height: 48px; border: 2px solid #F3EFE4; border-radius: 10px; background: transparent; color: #F3EFE4; font-family: Lalezar, sans-serif; font-size: 20px">رجوع</button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
var off = 'background: #14464A; border: 2px solid #2A5F62';
var on = 'background: #14464A; border: 3px solid #F2C14E';
return {
players: [
{ name: 'بوفهد', bank: 12, props: 6, box: on },
{ name: 'حمود', bank: 4, props: 3, box: off },
{ name: 'نورة', bank: 6, props: 3, box: off }
]
};
}
}
</script>
</body>
</html>
