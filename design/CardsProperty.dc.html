<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>كروت العقارات والفلوس والمباني</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1640px; min-height: 1400px; box-sizing: border-box; padding: 40px; background: #0F2E33; color: #F3EFE4; font-family: Tajawal, sans-serif; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Lalezar, sans-serif; font-size: 48px; line-height: 1; color: #F2C14E">كروت العقارات والفلوس والمباني</span>
<span style="font-size: 18px; color: #C9DAD8">28 عقار على 10 ألوان · 3 جيكر · 30 كرت فلوس · 10 كروت مباني · الإيجار يزيد كل ما زاد عدد العقارات من نفس اللون</span>
</div>

<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex; gap: 16px">
<sc-for list="{{row}}" as="sec" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Lalezar, sans-serif; font-size: 24px; line-height: 1.15">{{sec.title}}</span>
<span style="font-size: 14px; color: #C9DAD8">{{sec.note}}</span>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{sec.cards}}" as="c" hint-placeholder-count="3">
<div style="width: 144px; height: 212px; flex: none; border-radius: 10px; background: #F7F4EC; color: #1B1B1B; overflow: hidden; display: flex; flex-direction: column; text-align: center">
<span style="height: 26px; flex: none; background: {{sec.band}}"></span>
<span style="display: flex; justify-content: space-between; padding: 6px 10px 0; font-size: 12px; color: #5A5A5A"><span>{{sec.kind}}</span><span style="font-weight: 800; color: #1B1B1B; direction: ltr">{{c.n}}</span></span>
<span style="font-family: Lalezar, sans-serif; font-size: 22px; line-height: 1.1; min-height: 56px; padding: 0 8px; display: flex; align-items: center; justify-content: center">{{c.name}}</span>
<span style="font-size: 12.5px; line-height: 1.45; padding: 0 10px; color: #2B2B2B">{{c.text}}</span>
<span style="font-size: 15px; font-weight: 800; padding: 4px 10px 10px; margin-top: auto">{{c.big}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
function set(color, band, size, value, rent, names) {
return {
title: color + ' · طقم من ' + size,
note: 'قيمة العقار ' + value + ' · الإيجار ' + rent,
kind: 'عقار', band: band,
cards: names.map(function (n) { return { name: n, n: '', text: 'القيمة ' + value + ' · الإيجار حسب عدد العقارات', big: rent }; })
};
}
var any = 'linear-gradient(90deg,#8B5A2B 0 10%,#7EC8E3 10% 20%,#B5CC6A 20% 30%,#8E5BB5 30% 40%,#F08A24 40% 50%,#D7372F 50% 60%,#F4D03F 60% 70%,#2E9E5B 70% 80%,#1F3C88 80% 90%,#222222 90% 100%)';
var joker = { title: 'الجيكر', note: '3 كروت', kind: 'عقار', band: any, cards: [
{ name: 'جيكر', n: '×3', text: 'عقار يكمل أي طقم (أي لون). ما له قيمة فلوس، وصاحبه يقدر ينقله من طقم لطقم بدوره', big: '' }
] };
var money = { title: 'كروت الفلوس', note: '30 كرت — المجموع 87 دينار', kind: 'فلوس', band: '#2E9E5B', cards: [
{ name: '1 دينار', n: '×8', text: '', big: '' },
{ name: '2 دينار', n: '×7', text: '', big: '' },
{ name: '3 دنانير', n: '×5', text: '', big: '' },
{ name: '4 دنانير', n: '×5', text: '', big: '' },
{ name: '5 دنانير', n: '×4', text: '', big: '' },
{ name: '10 دنانير', n: '×1', text: '', big: '' }
] };
var build = { title: 'كروت المباني', note: '10 كروت · المبنى ينحط على طقم كامل فقط ويزيد إيجاره', kind: 'مبنى', band: '#6B7280', cards: [
{ name: 'منتجع', n: '×1', text: 'زيادة الإيجار', big: '+5' },
{ name: 'شاليه', n: '×2', text: 'زيادة الإيجار', big: '+4' },
{ name: 'قسيمه', n: '×3', text: 'زيادة الإيجار', big: '+3' },
{ name: 'عماره', n: '×4', text: 'زيادة الإيجار', big: '+4' }
] };
return { rows: [
[
set('بني', '#8B5A2B', 2, 1, '1 ← 2', ['الجهراء', 'الصليبية']),
set('أزرق فاتح', '#7EC8E3', 3, 1, '1 ← 2 ← 3', ['الفحيحيل', 'المنقف', 'أبو حليفة']),
set('فستقي', '#B5CC6A', 2, 2, '1 ← 2', ['الوفرة', 'العبدلي']),
set('بنفسجي', '#8E5BB5', 3, 2, '1 ← 2 ← 4', ['حولي', 'السالمية', 'الجابرية'])
],
[
set('برتقالي', '#F08A24', 3, 2, '1 ← 3 ← 5', ['الفروانية', 'خيطان', 'الرقعي']),
set('أحمر', '#D7372F', 3, 3, '2 ← 3 ← 6', ['المباركية', 'شرق', 'المرقاب']),
set('أصفر', '#F4D03F', 3, 3, '2 ← 4 ← 6', ['الخيران', 'بنيدر', 'الزور'])
],
[
set('أخضر', '#2E9E5B', 3, 4, '2 ← 4 ← 7', ['الشامية', 'كيفان', 'الروضة']),
set('أزرق غامق', '#1F3C88', 2, 4, '3 ← 8', ['ضاحية عبدالله السالم', 'النزهة']),
set('أسود', '#222222', 4, 2, '1 ← 2 ← 3 ← 4', ['الرياض', 'دبي', 'الدوحة', 'المنامة']),
joker
],
[money, build]
] };
}
}
</script>
</body>
</html>
