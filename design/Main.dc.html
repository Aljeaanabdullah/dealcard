<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>طاولة اللعب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 844px; height: 390px; box-sizing: border-box; padding: 12px; background: #0F2E33; color: #F3EFE4; font-family: Tajawal, sans-serif; display: flex; flex-direction: column; gap: 8px">

<!-- الصف العلوي -->
<div style="height: 66px; display: flex; gap: 8px">
<div style="width: 190px; box-sizing: border-box; background: #0B2327; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: Lalezar, sans-serif; font-size: 18px; color: #F2C14E">دورك</span>
<span style="font-size: 18px; font-weight: 800; direction: ltr">0:47</span>
</div>
<div style="height: 4px; border-radius: 2px; background: #2A5F62"><div style="width: 52%; height: 4px; border-radius: 2px; background: #F2C14E"></div></div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #C9DAD8">
<span>لعبت 1 من 3</span>
<span style="width: 9px; height: 9px; border-radius: 50%; background: #F2C14E"></span>
<span style="width: 9px; height: 9px; border-radius: 50%; border: 1px solid #C9DAD8; box-sizing: border-box"></span>
<span style="width: 9px; height: 9px; border-radius: 50%; border: 1px solid #C9DAD8; box-sizing: border-box"></span>
</div>
</div>

<div style="flex: 1; box-sizing: border-box; background: #0B2327; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #2A5F62; display: flex; align-items: center; justify-content: center; font-family: Lalezar, sans-serif; font-size: 20px">ب</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 14px">{{top.name}}</span>
<span style="font-size: 12px; color: #C9DAD8">باليد {{top.hand}} · البنك {{top.bank}}</span>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto">
<sc-for list="{{top.sets}}" as="s" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px; background: #14464A; font-size: 12px; {{s.ring}}"><span style="width: 11px; height: 11px; border-radius: 2px; box-shadow: 0 0 0 1px #C9DAD8; background: {{s.c}}"></span><span style="direction: ltr">{{s.t}}</span></span>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 8px">
<button aria-label="إيموجي وعبارات" style="width: 50px; height: 66px; border: 0; border-radius: 10px; background: #0B2327; color: #F3EFE4; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5c1 1.4 2.4 2 4 2s3-.6 4-2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg>
</button>
<a href="Settings.dc.html" aria-label="الإعدادات" style="width: 50px; height: 66px; border-radius: 10px; background: #0B2327; color: #F3EFE4; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
</a>
</div>
</div>

<!-- الصف الأوسط -->
<div style="height: 136px; display: flex; gap: 8px">
<sc-for list="{{sides}}" as="p" hint-placeholder-count="3">
<div style="{{p.box}}">
<sc-if value="{{p.isPlayer}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #2A5F62; display: flex; align-items: center; justify-content: center; font-family: Lalezar, sans-serif; font-size: 18px">{{p.initial}}</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 14px">{{p.name}}</span>
<span style="font-size: 12px; color: #C9DAD8">باليد {{p.hand}} · البنك {{p.bank}}</span>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{p.sets}}" as="s" hint-placeholder-count="2">
<span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px; background: #14464A; font-size: 12px; {{s.ring}}"><span style="width: 11px; height: 11px; border-radius: 2px; box-shadow: 0 0 0 1px #C9DAD8; background: {{s.c}}"></span><span style="direction: ltr">{{s.t}}</span></span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{p.isTable}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 64px; height: 90px; box-sizing: border-box; border-radius: 8px; background: #1F3C88; border: 3px solid #F2C14E; display: flex; align-items: center; justify-content: center; font-family: Lalezar, sans-serif; font-size: 13px; color: #F2C14E; direction: ltr; text-align: center; line-height: 1.1">DEAL<br>Q8</div>
<span style="font-size: 12px; color: #F3EFE4">كومة السحب</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 64px; height: 90px; border-radius: 8px; background: #F7F4EC; color: #1B1B1B; overflow: hidden; display: flex; flex-direction: column; text-align: center; box-shadow: 0 0 0 3px #E4572E">
<span style="height: 14px; background: #2BA6A0"></span>
<span style="font-size: 10px; color: #5A5A5A; margin-top: 4px">أكشن</span>
<span style="font-family: Lalezar, sans-serif; font-size: 16px; flex: 1; display: flex; align-items: center; justify-content: center">اسحب 2</span>
</div>
<span style="font-size: 12px; color: #F3EFE4">النار</span>
</div>
</sc-if>
</div>
</sc-for>
</div>

<!-- الصف السفلي: أنا -->
<div style="height: 148px; display: flex; gap: 8px">
<div style="width: 236px; box-sizing: border-box; background: #0B2327; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border: 2px solid #F2C14E">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-weight: 800; font-size: 14px">أنت</span>
<span style="font-size: 12px; color: #C9DAD8">الأطقم الكاملة 1 من 6</span>
</div>
<span style="font-size: 12px; color: #C9DAD8">البنك · 9 دنانير</span>
<div style="display: flex; gap: 5px">
<sc-for list="{{myBank}}" as="m" hint-placeholder-count="4">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #F2C14E; color: #1B1B1B; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{m}}</span>
</sc-for>
</div>
<span style="font-size: 12px; color: #C9DAD8">العقارات</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{mySets}}" as="s" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px; background: #14464A; font-size: 12px; {{s.ring}}"><span style="width: 11px; height: 11px; border-radius: 2px; box-shadow: 0 0 0 1px #C9DAD8; background: {{s.c}}"></span>{{s.n}} <span style="direction: ltr">{{s.t}}</span></span>
</sc-for>
</div>
</div>

<div style="flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding-bottom: 4px">
<sc-for list="{{hand}}" as="c" hint-placeholder-count="6">
<button style="width: 72px; height: 104px; flex: none; padding: 0; border: 0; border-radius: 8px; background: #F7F4EC; color: #1B1B1B; overflow: hidden; display: flex; flex-direction: column; font-family: inherit; text-align: center; {{c.extra}}">
<span style="height: 16px; flex: none; background: {{c.band}}"></span>
<span style="font-size: 10px; color: #5A5A5A; margin-top: 4px">{{c.kind}}</span>
<span style="font-family: Lalezar, sans-serif; font-size: 15px; line-height: 1.1; padding: 2px 4px; flex: 1; display: flex; align-items: center; justify-content: center">{{c.name}}</span>
<span style="font-size: 10px; padding: 0 4px 6px; color: #3A3A3A">{{c.sub}}</span>
</button>
</sc-for>
</div>

<div style="width: 96px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<button style="height: 48px; border: 0; border-radius: 10px; background: #F2C14E; color: #1B1B1B; font-family: Lalezar, sans-serif; font-size: 17px">العب الكرت</button>
<button style="height: 48px; border: 2px solid #F3EFE4; border-radius: 10px; background: transparent; color: #F3EFE4; font-family: Lalezar, sans-serif; font-size: 17px">إنهاء الدور</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
var done = 'box-shadow: 0 0 0 2px #F2C14E';
var side = 'width: 170px; box-sizing: border-box; background: #0B2327; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px';
var table = 'flex: 1; box-sizing: border-box; background: #14464A; border-radius: 70px; border: 2px solid #2A5F62; display: flex; align-items: center; justify-content: center; gap: 36px';
return {
top: { name: 'بوفهد', hand: 5, bank: 12, sets: [
{ c: '#2E9E5B', t: '3/3', ring: done },
{ c: '#7EC8E3', t: '2/3', ring: '' },
{ c: '#222222', t: '1/4', ring: '' }
] },
sides: [
{ isPlayer: true, isTable: false, box: side, initial: 'ح', name: 'حمود', hand: 7, bank: 4, sets: [
{ c: '#F08A24', t: '1/3', ring: '' },
{ c: '#D7372F', t: '2/3', ring: '' }
] },
{ isPlayer: false, isTable: true, box: table, sets: [] },
{ isPlayer: true, isTable: false, box: side, initial: 'ن', name: 'نورة', hand: 3, bank: 6, sets: [
{ c: '#1F3C88', t: '2/2', ring: done },
{ c: '#B5CC6A', t: '1/2', ring: '' }
] }
],
myBank: [1, 2, 2, 4],
mySets: [
{ c: '#F4D03F', n: 'أصفر', t: '3/3', ring: done },
{ c: '#8E5BB5', n: 'بنفسجي', t: '2/3', ring: '' },
{ c: '#8B5A2B', n: 'بني', t: '1/2', ring: '' }
],
hand: [
{ band: '#8E5BB5', kind: 'عقار', name: 'السالمية', sub: 'القيمة 2', extra: 'transform: translateY(-12px); box-shadow: 0 0 0 3px #F2C14E' },
{ band: '#2E9E5B', kind: 'فلوس', name: '5 دنانير', sub: '', extra: '' },
{ band: '#F2C14E', kind: 'أكشن', name: 'قرقش', sub: '5 دنانير', extra: '' },
{ band: '#1F3C88', kind: 'رد', name: 'مالك امل', sub: 'يلغي أكشن', extra: '' },
{ band: 'linear-gradient(90deg,#F4D03F 50%,#D7372F 50%)', kind: 'إيجار', name: 'ايجار الجميع', sub: 'أصفر وأحمر', extra: '' },
{ band: '#6B7280', kind: 'مبنى', name: 'عماره', sub: 'الإيجار +4', extra: '' }
]
};
}
}
</script>
</body>
</html>
